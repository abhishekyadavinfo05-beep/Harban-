[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/payments/razorpay/config"
  to = "/.netlify/functions/razorpay-config"
  status = 200

[[redirects]]
  from = "/api/payments/razorpay/create-order"
  to = "/.netlify/functions/razorpay-create-order"
  status = 200

[[redirects]]
  from = "/api/payments/razorpay/verify"
  to = "/.netlify/functions/razorpay-verify"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
